# Explicit reachability/exclusion decisions only.
# This file may not be used to hide missing implementation.
#
# Keyed by obligation id, exactly as `habbo-spec completeness` prints it:
#
#   obligations:
#     incoming/ChangeQueue:
#       reachability: not_applicable
#       reason: "the target client exits before this interaction becomes reachable"
#       evidence:
#         - "client:WIN63-202607011411-782849652:_SafeCls_2117"
#       decided_by: "ADR-FC-001"
#
# reason is one line: the reader supports block mappings, block sequences and single-line scalars.
# An entry missing reason, evidence or decided_by fails the command instead of excluding anything.
# ADR-FC-002 (docs/completeness/reviews/FC-2-triage.md) — sixteen composers the WIN63 build
# registers and ships but never constructs. Each class name appears in exactly two places in the
# whole decompiled tree: the registry that maps every composer, and its own definition file. No
# `new`, no import, no reference as a value. The client cannot send them.
