version: 1

# Evidence-backed promotions from IMPLEMENTED toward COMPLETE.
# Do not record entries until the implementation exists.
#
#   obligations:
#     incoming/MoveObject:
#       verified_at_commit: "abc1234"
#       tests:
#         - "Vortex.Rooms.Tests/Furniture/MoveObjectTests.cs"
#       protocol:
#         - "docs/habbo-specs/packets/incoming/room/move_object.yaml"
#
# A record pointed at anything that is not already implemented is reported as a problem and
# promotes nothing. Cite the exact test path: a similar class name is not evidence.
obligations: {}

rules:
  required_fields:
    - verified_at_commit
    - tests
    - protocol
  cannot_override:
    - MISSING
    - UNRESOLVED_SURFACE
