manual:
  sources:
  - "AIR-1.0.31 client: com/sulake/habbo/navigator/raidprotection/** and _SafePkg_4207/**. No WIN63 build contains the feature at all."
  - "Sulake announcement, 'How do we deal with botting?' by sirjonasxx (August 2026 promo asset spromo_raidprotection_aug26). The only official prose that exists about this feature. Quoted below where it settles something."
  - "vortex-modern-client: packages/vortex-engine/src/habbo/navigator/raidprotection/** — the feature is already ported client-side, and its HabboMessages.ts assigns the header ids this revision must match."
  notes:
  - "WHAT IS KNOWN from the client is the settings panel: five messages, their field order, and the exact value sets it will send (sensitivity 0-2; action 0=kick, 1=temporary ban; ban durations 300..604800 from a fixed list of ten; guard durations 300..10800 from a fixed list of five). RaidProtectionSettingsController.valid() refuses to compose anything else, which is why the server re-checks the same lists: a modified client reaches the same handler."
  - "WHO MAY MANAGE IT is official, not inferred: 'a new menu in the room settings which can be accessed by the room owner and Habbos with rights to the room. For official rooms, Ambassadors will be able to access these settings too.' Vortex grants owner + rights-holders. The Ambassador half is NOT implemented — this server has no ambassador role (IsAmbassador is hardcoded false) and no official-room flag; staff reach the settings through the dashboard instead. This spec previously recorded an owner-only rule as a Vortex decision; that was wrong and is corrected."
  - "WHAT THE SENSITIVITY MEANS is official: 'Depending on the type of room, the room creator can configure the sensitivity of this detection. A relaxed room might use a high sensitivity, whereas a super active game room should probably use a lower sensitivity.' So higher sensitivity = trips sooner, which is the direction Vortex implements (high = the smallest arrival threshold)."
  - "WHAT THE GUARD DOES is official: 'When a raid is detected, the room owner can temporarily restrict new Habbos from entering the room. How strict this protection should be and how long it should stay active can also be configured.' That maps onto guardEnabled / guardSensitivity / guardDurationSeconds, and is consistent with Vortex reading guardSensitivity as the threshold in force while the guard period runs. 'Restrict' is not further defined — whether Sulake bars all newcomers or only tightens the rule is still unknown; Vortex tightens the rule."
  - "WHAT IS STILL NOT KNOWN is the detector itself, and deliberately so on Sulake's side: 'Raids will be detected using algorithms that identify disruptive behaviour and unusual activity inside rooms', with the exact signals 'intentionally undisclosed'. Nothing reaches the client, so nothing can be read for it. Vortex's rule is therefore a DESIGN, not a reconstruction: distinct arrivals inside a one-minute sliding window against a per-sensitivity threshold (defaults 12/8/5, operator-tunable under room.raid_protection.threshold.*), in RoomRaidProtectionSystem."
  - "KNOWN GAP against that description: Sulake weighs behaviour and activity INSIDE the room; Vortex only counts arrivals at the door. A raid that walks in slowly and then floods the chat is not detected here. Widening the signal set is the obvious next slice and needs no wire change — the settings already carry everything the client can say."
  - "confirmed (the ninth field): the client sets it only on an off-to-on transition, after its own prompt. It therefore cannot be required on every save. Vortex gates exactly one case on it — enabling protection while an incident is already running — and otherwise records it."
