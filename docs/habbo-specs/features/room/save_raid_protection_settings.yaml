manual:
  notes:
  - "Feature origin: AIR 1.0.31 only. No WIN63 build contains com/sulake/habbo/navigator/raidprotection at all, so this is newer than the client this revision targets. Nothing about it appears in any public Habbo announcement either — the client is the only source."
  - "WHAT IS KNOWN is the settings panel: five messages, their field order, and the exact value sets the client will send (sensitivity 0-2; action 0=kick, 1=temporary ban; ban durations 300..604800 from a fixed list of ten; guard durations 300..10800 from a fixed list of five). RaidProtectionSettingsController.valid() refuses to compose anything else, which is why the server re-checks the same lists: a modified client reaches the same handler."
  - "WHAT IS NOT KNOWN is the detector. The official server never puts a threshold, a window or a rule on the wire — the client only ever displays incidentActive and lastRaidAt — so nothing can be read for it. Vortex's rule is therefore a DESIGN, not a reconstruction: distinct arrivals inside a one-minute sliding window, against a per-sensitivity threshold (defaults 12/8/5, operator-tunable under room.raid_protection.threshold.*). Implemented in RoomRaidProtectionSystem."
  - "Also unknown, and decided here: what guardSensitivity means. Vortex reads it as the threshold in force during the post-incident guard period, replacing detectionSensitivity while that period runs. It is the reading that gives both dropdowns a distinct job and needs no second counter; no evidence supports or contradicts it."
  - "Also decided here: only the room OWNER may manage this. The client is told via the capability message and the server refuses anyone else, rights-holders included — a raid usually arrives with rights in the wrong hands, and the switch that stops it must not be reachable that way. Staff use the dashboard. Sulake's own rule is unknown."
  - "confirmed (the ninth field): the client sets it only on an off-to-on transition, after its own prompt. It therefore cannot be required on every save. Vortex gates exactly one case on it — enabling protection while an incident is already running — and otherwise records it."
