verified:
  slot_number_is_not_honoured:
    confidence: assumed
    claim: The slot number the client sends is read and ignored; the disk is appended to the end of the playlist.
    reason: "What the official server does with the slot is unknown - no capture observes it. The client's own editor offers no way to drop a disk into a chosen position, and its playlist has no gaps for one to land in: PlayListEditorWidgetHandler sends the slot as the index the widget happened to be showing. Honouring it would let a client claim a position that does not exist, and the only ordering the playlist has is insertion order, which is what the read returns. The reference emulator reads the field and discards it in the same way."
    evidence:
    - kind: client_code
      source: com/sulake/habbo/ui/handler/PlayListEditorWidgetHandler.as
      symbol: processWidgetMessage
    - kind: reference_emulator
      source: src/main/java/com/eu/habbo/messages/incoming/rooms/items/jukebox/AddJukeboxDiskEvent.java
      symbol: AddJukeboxDiskEvent
  capacity_refusal:
    confidence: assumed
    claim: A disk offered to a full jukebox is refused with JukeboxPlayListFull to the sender alone, and nothing moves.
    reason: "The client has a dialog for exactly this message and reads no fields from it, so the refusal is the whole answer. Whether the official server also re-sends the playlist afterwards is unknown; it is not sent here, because nothing changed."
    evidence:
    - kind: client_code
      source: com/sulake/habbo/sound/music/JukeboxPlayListController.as
      symbol: onJukeboxPlayListFullMessage
manual:
  ownership: "A loaded disk stays its owner's the whole time it is in the jukebox. Vortex stores that as furniture.jukebox_id, the same shape a wired chest uses, so the disk is one row in one place and can never be listed in an inventory and a playlist at once."
