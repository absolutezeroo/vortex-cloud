manual:
  schedule_format: "The request payload is one of the client's own `landing.view.*` schedule strings, echoed back beside the code it resolves to. Official server behaviour stays unknown, but the format is not in doubt: every shipped value in ../vortex-modern-client/sources/external_variables.txt is `<yyyy-MM-dd HH:mm>,<code>` pairs joined by `;`, in ascending date order (landing.view.dynamic.slot.{2,3,4,5}.conf, competition.timing). Vortex answers with the code of the latest pair whose date has passed, and empty when none has. `competition.timing` ends on a pair with an EMPTY code, which only makes sense if each pair means \"from this moment, this code\" and an empty one switches the campaign off."
  why_it_matters: "An empty code is the client's \"nothing scheduled\" case: WidgetContainerWidget.switchCurrentWidget('') drops its inner widget and refreshContent() hides every child, so a slot configured as `widgetcontainer` renders nothing at all. Vortex answered `string.Empty` unconditionally until 2026-09-13, which is why every dynamic slot on the landing view was blank."
  arcturus_is_not_a_reference: "HABBO-ARCTURUS-DAYBREAK GetCurrentTimingCodeMessageEvent ignores the dates entirely, takes the first entry only (it `break`s), and echoes THAT entry back as the schedule string. For any multi-entry schedule the string it returns is not the one the client sent, so WidgetContainerWidget.onTimingCode's `parser.schedulingStr == _schedulingStr` guard drops the reply. It works only for a single-pair schedule."
