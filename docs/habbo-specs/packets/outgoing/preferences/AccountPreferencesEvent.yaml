manual:
  note: "Nineteen fields, the last six optional (the client guards each with bytesAvailable > 0 and falls back to its own default). Optional is not ignorable: HabboFreeFlowChat.onAccountPreferences reads the last four back into the chat dialog, so a server that stops early truncates nothing but silently resets the player's chat settings on every login. The client writes them on SetChatPreferences (mode, width, speed) and SetChatStylePreference (font size)."
