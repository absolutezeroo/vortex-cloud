manual:
  notes:
  - "The header id is NOT the client's, and is NOT freely chosen either. AIR 1.0.31 binds this message at 3620, which WIN63-202607011411 — the build this revision targets — already spends on SecondsUntil; 734 (capability) collides with ChatReviewSessionOfferedToGuide the same way, while 3553 (settings) is free on both sides and is kept. vortex-modern-client had to solve the identical collision when it ported the feature and assigned 3554 (capability) and 3555 (this message), the first ids after 3553 unused as an event AND as a composer in the WIN63 registry, in that file, and here. Its HabboMessages.ts says these 'must be assigned identically in the emulator's Headers.cs', so they are: the client is the authority on this, not us. The two incoming ids are the client's own (206, 2687), safe because WIN63 composes nothing on either."
  - "resultCode: the client declares seven values (0-6) and acts on one distinction — 0 closes the dialog, anything else redraws the panel from the settings in this same packet and leaves it open. So 0 = success is client_confirmed and the other six are UNKNOWN: their names in RaidProtectionSaveResult are this emulator's, not Sulake's."
  - "Because a failure repaints the panel, the settings written here must always be the room's real state. Echoing back the draft that was just refused would leave the owner looking at values the room does not hold."
