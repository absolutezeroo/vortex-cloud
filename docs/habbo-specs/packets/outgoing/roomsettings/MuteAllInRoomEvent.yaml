  behaviour: "A toggle, not a sanction: the incoming MuteAllInRoom carries no field and the room answers with where the switch landed. While it is on, only the room's rights-holders can speak; everyone else's line is dropped with no reply, as in the reference emulator (HABBO-ARCTURUS-DAYBREAK RoomChatManager:295). Vortex keeps the switch in live room state and does not persist it, so a room cannot be left silent by someone who forgot to turn it off."
