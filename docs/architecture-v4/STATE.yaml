# What the roadmap still has, and what each one is waiting on.
remaining:
  - id: PR-S2
    what: strategies per ProductType contributing to the plan
    note: >
      the planner already isolates every rule and is fully tested; splitting it into one strategy per
      type is structure, not correctness, and earns itself when a third caller needs one.
  - id: PR-Q2
    what: protocol baseline resorption, persistence loss-window doc, full wired StopReason coverage
  - id: PR-Z1
    what: closing benchmarks against the P0-C baseline, docs, ADR review
  - id: dashboard
    what: docs/architecture/dashboard-api-security.md, the parts §17 does not cover
    note: >
      unblocked: the other session's dashboard work landed at ce04752b and the tree is clean.
      §17 is done (PR-D1). Audited as absent and still open: §7 step-up MFA for the
      destructive operations, §10 ProblemDetails with a urn:vortex type and the correlation id in
      the error payload (98 endpoints answer `{ error }` today and the SPA reads `data.error`),
      §5 ActorSecurityContext.
    deliberate_gaps:
      - id: dashboard.mfa.recovery
        why: >
          recovery codes do not exist in this product -- no match for "recovery" anywhere in
          Vortex.Authentication. A counter for an event that cannot happen is a dial that reads zero
          for a reason nobody can look up. Add it with the feature.
      - id: dashboard.cfh.queue.size
        why: >
          no in-memory source. IModerationQueueGrain holds subscribers, not tickets; the queue is a
          table. An observable gauge would run a COUNT per scrape, which spends the database the
          control plane exists to protect. If it is wanted, count the transitions the grain already
          publishes and read the backlog as opened-minus-closed.
