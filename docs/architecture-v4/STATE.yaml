# What the roadmap still has, and what each one is waiting on.
remaining:
  - id: PR-Q2
    what: the 29 wire disagreements nobody has read yet
    note: >
      PR-Q2b did the enabling half rather than 23 hand verdicts. The client scanner bound headers only
      to composers, so 17 of 805 outgoing packets carried evidence from WIN63-202607011411 -- the
      build this emulator targets -- against 533 of 604 incoming. Every outgoing comparison was being
      made against a client from 2016, which is where the "known disagreements" came from. Binding the
      parser behind each MessageEvent wrapper took outgoing evidence to 514, and ConflictDetector now
      collapses repeated blocks so a client loop compares against an emulator array.
      PR-Q2c then taught it to follow one level of constructor delegation -- a parser doing
      `new SomeEntry(wrapper)` inside its loop -- which resolved 32 entries at a stroke and took the
      queue to 45. 17 of those have since been read against the AS3 and are artifacts or empty
      composers; 28 are unread and named in the hook's comment.
      The mirror image on our side landed too: WireLayoutExtractor now follows any call that hands
      the packet to another method -- the test is the packet, not the method's name, which is what
      the old Serialize/SerializeArray list got wrong. ModeratorInit resolved itself that way, which
      is the check on the change: it had been read by hand first and found correct.
      What neither side follows is delegation through a method on an existing object
      (`entry.parse(wrapper)` in the client). That undercounts the CLIENT, so the entries where the
      client's number looks too small are probably that. Diminishing returns: four rounds of this
      found one real bug, and the rest is the tool learning to read. Stop tuning the scanner and read
      the 29 by hand when a dialog misbehaves.
    found:
      - id: AcceptFriendResult sent on 3407
        what: >
          WIN63 binds server->client 3407 to SelfDonationResultMessageEvent; the accept-friend result
          is 3707. A failed friend request reached the client's self-donation handler and the friend
          list never heard about it. Caught by cross-checking the 25 registry entries whose class name
          survived obfuscation. Payload was correct all along -- count, then senderId/errorCode per
          entry -- which is why nothing else ever noticed.
      - id: OfficialSongId on 2264
        what: >
          also wrong (WIN63 has WeeklyCompetitiveFriendsLeaderboardEvent there), and latent rather
          than live: the serializer writes nothing, so it is one of the empty-composer set already
          triaged. Left alone deliberately; the right id is unknown and guessing one would be worse.
    note: >
      the other two thirds landed as PR-Q2a. Wired observability: REVALIDATION added to StopReason --
      a delayed effect that lost its pile used to be refused in total silence, which is the report
      that arrives as "my wired stopped working" -- plus event outcomes and index rebuilds. Loss
      window: docs/architecture-v4/persistence-loss-window.md, measured off the code, and two
      defects fixed on the way (a failed flush dropped its batch permanently; deactivation wrote one
      batch and abandoned the rest). What is left is the baselines themselves: 23 known wire
      conflicts and 3 unreachable headers, entry by entry, each needing a client re-read.
  - id: PR-Z1
    what: the exhaustive wired trace, the one requirement the matrix still calls unmet
    note: >
      opt-in in the note, and left open on purpose: a line per selection, per condition, per effect
      chosen or skipped would be a log nobody reads and a table growing faster than the room it
      describes. The identity half landed (PR-Z1d) and is what makes the existing log followable.
      Two more rows sit at warning rather than tick and cannot be closed here: the provenance SHA is
      written and inert until a reference tree arrives as a git checkout, and refusing a benchmark
      regression is a person reading the baseline in review rather than a script.
    note: >
      the baseline PR-G1 was supposed to leave behind never existed, so PR-Z1a created it rather than
      comparing against nothing: docs/architecture-v4/benchmarks/wired-engine.md, regenerated with
      VORTEX_BENCH=1. The "no-trigger O(1)" claim is not in there -- it is a claim about which calls
      the engine makes, not about milliseconds, so it lives in WiredEngineCostTests and runs in the
      gate on every machine. A wall-clock assertion in the gate is a flake with a schedule.
      PR-Z1b closed the documentation half: add-a-wired-box.md, add-a-furni.md, and
      acceptance-matrix.md, which is the point of the exercise -- it names five requirements that are
      NOT met rather than declaring the refactor finished. In order of what is worth doing:
      StuffData round-trip per type (eight encodings, no test, and the failure looks like an
      unimplemented furni); Daybreak/Arcturus provenance; the partials rule, the last of §12.3 still
      living in prose; wired ExecutionId and the room-scoped trace; the hydration benchmark, which
      waits on OQ-7 rather than on effort.
    deliberate_gaps:
      - id: walkthrough - add a furni / add a wired box
        why: >
          both have a hundred-plus worked examples in the tree already, and add-a-feature.md carries
          the placement rules. add-a-commerce-flow.md was written first because it is the opposite
          case: a brand-new contract, no example to copy, and getting it wrong loses money rather
          than time. The wired one has a genuine new thing to say (a box is now testable on a fake
          room) and is worth writing next.
  - id: dashboard
    what: nothing of substance; kept for the two deliberate gaps recorded below
    note: >
      unblocked: the other session's dashboard work landed at ce04752b and the tree is clean.
      §17 done (PR-D1). §7 done (PR-D2): the critical set is named by capability rather than by
      route, so an endpoint written tomorrow under OpsGrantCurrency arrives protected;
      `Vortex:Observability:DashboardStepUpMinutes` is 0 by default, and turning it on is the whole
      switch. §10 done (PR-D3): all seven invariants hold. The `ProblemDetails` *shape* was not
      adopted — the note makes it optional ("le shape exact peut suivre ProblemDetails") and
      `{ error }` already is the stable code, read by the SPA at lib/api.js. Nothing of substance is
      left in this document.
      §5 done (PR-D4): ActorSecurityContext is ambient for the length of a request and carries the
      server's own view of the caller -- account, session, resolved capabilities, when that session
      last proved a second factor, correlation id. Ambient rather than threaded through ninety-five
      signatures for the same reason the correlation id is: the value belongs to the request, and a
      parameter every method forwards untouched is one somebody eventually forgets to forward.
      `string actor` stays as what it always was, the name on the audit row, and the audit now
      records the account behind the session next to it plus an `actorMismatch` flag -- a row where
      the two disagree is a bug in a call site or somebody writing under a name that is not theirs.
    deliberate_gaps:
      - id: dashboard.mfa.recovery
        why: >
          recovery codes do not exist in this product -- no match for "recovery" anywhere in
          Vortex.Authentication. A counter for an event that cannot happen is a dial that reads zero
          for a reason nobody can look up. Add it with the feature.
      - id: dashboard.cfh.queue.size
        why: >
          no in-memory source. IModerationQueueGrain holds subscribers, not tickets; the queue is a
          table. An observable gauge would run a COUNT per scrape, which spends the database the
          control plane exists to protect. If it is wanted, count the transitions the grain already
          publishes and read the backlog as opened-minus-closed.
      - id: §10 ProblemDetails shape
        why: >
          the invariants were the frozen part and all seven hold; the shape is explicitly optional in
          the note. Adopting it means rewriting 98 endpoint literals and the SPA's error reader for a
          renamed field, with no invariant gained. `type`/`title`/`detail` would be three constants
          per code and nothing reads them.
      - id: correlation id middleware test
        why: >
          the request-scoped id is opened inside the pipeline's outermost lambda, which builds only
          with Orleans and a database behind it. The rule that can leak silently -- which exception
          messages reach an operator -- is unit-tested (DomainRejectionMessageTests); the header stamp
          fails visibly (no header) rather than silently.
      - id: step-up default
        why: >
          DashboardStepUpMinutes is 0 out of the box. Turning it on for a hotel whose operators have
          not enrolled a factor refuses every critical operation until they do -- correct, and not
          something to inflict by upgrading. The note asks that the operations be *able* to require
          a recent factor, which they now are.
