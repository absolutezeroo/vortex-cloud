  - PR-F1  # a logic name claimed twice is a collision (ADR-000, D-V4-9)
  - PR-Q1  # both furniture definition indexes published as one version
  - PR-S1  # CatalogFulfillmentPlanner: what an offer promises, worked out purely

# What the roadmap still has, and what each one is waiting on.
remaining:
  - id: PR-W2..W4
    what: extract TriggerIndex/StackResolver/Scheduler/Policy/SelectionEngine/CallChainGuard
    blocked_on: >
      the actions half of IWiredRoomHost. It is the contract 171 box classes implement against, so
      moving it is a semantic slice rather than a mechanical one.
  - id: PR-S2
    what: strategies per ProductType contributing to the plan
    note: >
      the planner already isolates every rule and is fully tested; splitting it into one strategy per
      type is structure, not correctness, and earns itself when a third caller needs one.
