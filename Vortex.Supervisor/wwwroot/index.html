<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vortex Supervisor</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #141b33;
        --line: #243154;
        --ink: #e6ebff;
        --muted: #8fa0c8;
        --gold: #f2b544;
        --ok: #3ddc97;
        --bad: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      h1 { font-size: 15px; margin: 0; letter-spacing: 0.02em; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
      .dot.on { background: var(--ok); }
      .dot.off { background: var(--bad); }
      .spacer { flex: 1; }
      button {
        background: #1d2745;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font: inherit;
      }
      button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      main { padding: 16px 20px; }
      #log {
        background: #070b18;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        height: calc(100vh - 210px);
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font: 12.5px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      form { display: flex; gap: 8px; margin-top: 12px; }
      input {
        flex: 1;
        background: #070b18;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        padding: 8px 10px;
        font: inherit;
      }
      input:focus { outline: none; border-color: var(--gold); }
      #gate { max-width: 380px; margin: 12vh auto; }
      .muted { color: var(--muted); }
      .err { color: var(--bad); min-height: 1.4em; }
    </style>
  </head>
  <body>
    <div id="gate">
      <h1>Vortex Supervisor</h1>
      <p class="muted">Paste the supervisor token to continue.</p>
      <form id="auth">
        <input id="token" type="password" autocomplete="off" placeholder="Token" />
        <button type="submit">Unlock</button>
      </form>
      <p class="err" id="authError"></p>
    </div>

    <div id="app" hidden>
      <header>
        <h1>Vortex Supervisor</h1>
        <span class="dot" id="dot"></span>
        <span id="state" class="muted">—</span>
        <span id="health" class="muted"></span>
        <span class="spacer"></span>
        <button id="start">Start</button>
        <button id="restart">Restart</button>
        <button id="stop">Stop</button>
      </header>
      <main>
        <div id="log"></div>
        <form id="cmd">
          <input id="line" autocomplete="off" placeholder="Command (try: help)" />
          <button type="submit">Send</button>
        </form>
        <p class="err" id="error"></p>
      </main>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const log = $('log');

      function append(text) {
        // Scroll only when the operator is already at the bottom, so reading back through the
        // buffer is not yanked away by every new line.
        const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
        const row = document.createElement('div');
        row.textContent = text;
        log.appendChild(row);
        while (log.childElementCount > 4000) log.removeChild(log.firstChild);
        if (atBottom) log.scrollTop = log.scrollHeight;
      }

      async function api(path, options) {
        const res = await fetch(path, { credentials: 'same-origin', ...options });
        if (res.status === 401) {
          $('app').hidden = true;
          $('gate').hidden = false;
          throw new Error('Unauthorized');
        }
        return res;
      }

      $('auth').addEventListener('submit', async (e) => {
        e.preventDefault();
        $('authError').textContent = '';
        const res = await fetch('/api/session', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { Authorization: 'Bearer ' + $('token').value },
        });
        if (!res.ok) {
          $('authError').textContent = 'That token was not accepted.';
          return;
        }
        $('token').value = '';
        $('gate').hidden = true;
        $('app').hidden = false;
        connect();
        refresh();
      });

      function connect() {
        const source = new EventSource('/api/console', { withCredentials: true });
        source.onmessage = (e) => append(JSON.parse(e.data));
        source.onerror = () => {
          // EventSource retries on its own; the supervisor restarting is the expected case.
        };
      }

      async function refresh() {
        try {
          const res = await api('/api/status');
          const s = await res.json();
          $('state').textContent = s.state + (s.pid ? ' · pid ' + s.pid : '');
          $('health').textContent = s.health ? '· health ' + s.health : '';
          $('dot').className = 'dot ' + (s.state === 'Running' ? 'on' : 'off');
          $('start').disabled = s.state === 'Running' || s.state === 'Starting';
          $('stop').disabled = s.state === 'Stopped' || s.state === 'Stopping';
        } catch {
          /* the gate is already showing */
        }
      }

      for (const action of ['start', 'stop', 'restart']) {
        $(action).addEventListener('click', async () => {
          $(action).disabled = true;
          $('error').textContent = '';
          try {
            await api('/api/' + action, { method: 'POST' });
          } catch (e) {
            $('error').textContent = String(e.message ?? e);
          }
          refresh();
        });
      }

      $('cmd').addEventListener('submit', async (e) => {
        e.preventDefault();
        const line = $('line').value.trim();
        if (!line) return;
        $('line').value = '';
        $('error').textContent = '';
        const res = await api('/api/console', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ line }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          $('error').textContent = body.error ?? 'The command was refused.';
        }
      });

      setInterval(refresh, 3000);
    </script>
  </body>
</html>
